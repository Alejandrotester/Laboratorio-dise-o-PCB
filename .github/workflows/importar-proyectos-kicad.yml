name: Importar proyectos KiCad desde ZIP
on:
  push:
    branches: [main]
    paths:
      - 'Repositorio_KiCad_3_Ejercicios_Para_GitHub.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Extraer archivos de los tres proyectos
        shell: bash
        run: |
          set -euo pipefail
          test -f Repositorio_KiCad_3_Ejercicios_Para_GitHub.zip
          unzip -o Repositorio_KiCad_3_Ejercicios_Para_GitHub.zip -d .
          test -f 'Ejercicio_1_Linterna/Ejercicio 1.kicad_pcb'
          test -f 'Ejercicio_2_ESP32_S3_Mini/Ejercicio 2.kicad_pcb'
          test -f 'Ejercicio_3_ESP32_S3_USB_C_PCBA/Laboratorio_3_ESP32S3.kicad_pcb'
      - name: Publicar fuentes, informe y evidencias
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay archivos nuevos.'
          else
            git commit -m 'feat: publicar los tres proyectos KiCad, informe IEEE y cotizaciones'
            git push
          fi
